name: Build map data

on:
  push:
    branches: [main]
    paths: ['pipeline/**', '.github/workflows/build-data.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: pip install requests remotezip numpy
      - name: Run pipeline
        run: python pipeline/probe.py
      - name: Save results
        if: always()
        run: |
          git config user.name "mushroom-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p data
          git add data/ || true
          git diff --cached --quiet || git commit -m "Update map data [skip ci]"
          git pull --rebase origin main
          git push
